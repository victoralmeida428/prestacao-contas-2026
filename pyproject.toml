[project]
name = "candidatos"
version = "0.1.0"
description = "Dashboard de prestacao de contas eleitorais 2026 (TSE)"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.4.1",
    "gunicorn>=26.2.0",
    "plotly>=7.1.0",
    "polars>=1.44.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidatos"]
